<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Vercel Bomber — Admin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: ui-monospace, Menlo, monospace; background: #070707; color: #eaeaea; margin: 0; padding: 24px; }
  h1 { font-size: 16px; letter-spacing: 2px; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; }
  .card { background: #101010; border: 1px solid #1e1e1e; border-radius: 12px; padding: 20px; }
  label { display: block; font-size: 11px; color: #888; margin: 10px 0 4px; }
  input, select { width: 100%; padding: 8px; background: #050505; border: 1px solid #242424; border-radius: 6px; color: #eaeaea; font: inherit; }
  button { margin-top: 14px; padding: 10px 14px; background: #2563eb; border: 0; color: white; border-radius: 6px; font: inherit; cursor: pointer; }
  button.ghost { background: #1a1a1a; border: 1px solid #2a2a2a; }
  button.danger { background: #b91c1c; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 8px; border-bottom: 1px solid #1e1e1e; text-align: left; }
  th { color: #666; font-weight: normal; }
  .stat { display: flex; gap: 12px; margin-bottom: 16px; }
  .stat div { background: #101010; border: 1px solid #1e1e1e; border-radius: 8px; padding: 12px 16px; flex: 1; }
  .stat b { font-size: 20px; display: block; }
  .stat span { font-size: 10px; color: #666; letter-spacing: 1px; }
  pre { background: #050505; border-radius: 8px; padding: 12px; font-size: 11px; max-height: 200px; overflow: auto; }
</style>
</head>
<body>
<h1>VERCEL BOMBER // ADMIN</h1>

<div id="login" class="card" style="max-width: 340px;">
  <label>Username</label><input id="user" />
  <label>Password</label><input id="pass" type="password" />
  <button id="loginBtn">UNLOCK</button>
</div>

<div id="panel" class="grid" style="display:none;">
  <div>
    <div class="card">
      <h1 style="font-size:12px;">GENERATE KEY</h1>
      <label>Label</label><input id="kLabel" placeholder="client-1" />
      <label>Modes (comma)</label><input id="kModes" value="mix" />
      <label>Daily quota</label><input id="kQuota" type="number" value="100" />
      <label>Cooldown (sec)</label><input id="kCooldown" type="number" value="30" />
      <label>Expires in days (blank = never)</label><input id="kExp" type="number" />
      <button id="genBtn">GENERATE</button>
      <pre id="newKey" style="margin-top:12px;"></pre>
    </div>
  </div>
  <div>
    <div class="stat">
      <div><b id="sTotal">-</b><span>TOTAL KEYS</span></div>
      <div><b id="sActive">-</b><span>ACTIVE</span></div>
      <div><b id="sHits">-</b><span>HITS TODAY</span></div>
    </div>
    <div class="card">
      <h1 style="font-size:12px;">KEYS</h1>
      <table><thead><tr><th>Label</th><th>Modes</th><th>Quota</th><th>Used</th><th>Status</th><th></th></tr></thead><tbody id="keysBody"></tbody></table>
    </div>
    <div class="card" style="margin-top: 20px;">
      <h1 style="font-size:12px;">RECENT HITS</h1>
      <pre id="recent"></pre>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let token = null;

async function api(path, opts = {}) {
  opts.headers = { ...(opts.headers || {}), 'authorization': 'Bearer ' + token, 'content-type': 'application/json' };
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

$('loginBtn').onclick = async () => {
  const r = await fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ username: $('user').value, password: $('pass').value })
  });
  if (!r.ok) { alert('bad credentials'); return; }
  token = (await r.json()).token;
  $('login').style.display = 'none';
  $('panel').style.display = 'grid';
  refresh();
};

$('genBtn').onclick = async () => {
  const body = {
    label: $('kLabel').value || 'client',
    modes: $('kModes').value.split(',').map(s => s.trim()).filter(Boolean),
    dailyQuota: Number($('kQuota').value) || 100,
    cooldownSec: Number($('kCooldown').value) || 30,
    expiresInDays: $('kExp').value ? Number($('kExp').value) : null,
  };
  const out = await api('/api/admin/keys', { method: 'POST', body: JSON.stringify(body) });
  $('newKey').textContent = 'KEY: ' + out.key + '\n\n(save it — not recoverable)';
  refresh();
};

async function refresh() {
  const s = await api('/api/admin/stats');
  $('sTotal').textContent = s.total_keys;
  $('sActive').textContent = s.active_keys;
  $('sHits').textContent = s.total_hits_today;
  $('recent').textContent = s.recent.map(r => `${new Date(r.ts).toLocaleTimeString()}  ${r.mode}  ${r.phone}`).join('\n') || 'no hits';

  const keys = await api('/api/admin/keys');
  const usage = Object.fromEntries(s.usage.map(u => [u.id, u.used]));
  $('keysBody').innerHTML = keys.map(k => `
    <tr>
      <td>${k.label}</td>
      <td>${(k.modes || []).join(',')}</td>
      <td>${k.dailyQuota}</td>
      <td>${usage[k.id] || 0}</td>
      <td>${k.revoked === 'true' ? 'revoked' : 'active'}</td>
      <td>
        <button class="ghost" onclick="revoke('${k.id}')">revoke</button>
        <button class="danger" onclick="del('${k.id}')">del</button>
      </td>
    </tr>
  `).join('');
}

window.revoke = async id => { await api('/api/admin/key?id=' + id, { method: 'PATCH' }); refresh(); };
window.del = async id => { if (confirm('delete?')) { await api('/api/admin/key?id=' + id, { method: 'DELETE' }); refresh(); } };

setInterval(() => { if (token) refresh().catch(() => {}); }, 15000);
</script>
</body>
</html>
