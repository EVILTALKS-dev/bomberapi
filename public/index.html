<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Vercel Bomber</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, Menlo, monospace; background: #0a0a0a; color: #eaeaea; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  .card { background: #131313; border: 1px solid #242424; border-radius: 12px; padding: 28px; width: 420px; }
  h1 { font-size: 18px; margin: 0 0 18px; letter-spacing: 1px; }
  label { display: block; font-size: 12px; color: #888; margin: 12px 0 4px; }
  input, select { width: 100%; padding: 10px; background: #0a0a0a; border: 1px solid #262626; border-radius: 8px; color: #eaeaea; font: inherit; box-sizing: border-box; }
  button { width: 100%; margin-top: 18px; padding: 12px; background: #2563eb; border: 0; color: white; border-radius: 8px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  pre { margin-top: 18px; font-size: 11px; background: #0a0a0a; border: 1px solid #242424; border-radius: 8px; padding: 12px; max-height: 260px; overflow: auto; }
</style>
</head>
<body>
<div class="card">
  <h1>VERCEL BOMBER</h1>
  <label>Phone (10 digits)</label>
  <input id="phone" placeholder="9xxxxxxxxx" maxlength="10" />
  <label>Mode</label>
  <select id="mode">
    <option value="mix">mix</option>
    <option value="sms">sms</option>
    <option value="call">call</option>
    <option value="whatsapp">whatsapp</option>
  </select>
  <label>API Key</label>
  <input id="key" placeholder="vb_..." />
  <button id="go">FIRE</button>
  <pre id="out"></pre>
</div>
<script>
const $ = id => document.getElementById(id);
$('go').onclick = async () => {
  const body = { phone: $('phone').value.trim(), mode: $('mode').value, key: $('key').value.trim() };
  $('go').disabled = true;
  $('out').textContent = 'firing...';
  try {
    const r = await fetch('/api/bomb', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    $('out').textContent = JSON.stringify(await r.json(), null, 2);
  } catch (e) {
    $('out').textContent = 'error: ' + e.message;
  } finally {
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
